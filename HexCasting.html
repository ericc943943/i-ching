<style>
  :root{
    --bg:#F2EEE3; --surface:#FBF8F1; --ink:#33291F; --sub:#6b6255;
    --accent:#7A5230; --gold:#B98455; --jade:#4B5C46; --line:rgba(51,41,31,.15);
    --dot:#059669;
    --font-head:'Noto Serif TC',serif; --font-body:'Noto Serif TC',serif; --font-label:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
    display:flex;justify-content:center;padding:48px 20px;}
  .page{width:100%;max-width:560px;}
  .eyebrow{font-family:var(--font-label);font-size:12px;letter-spacing:.25em;color:var(--gold);
    text-align:center;text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:var(--font-head);font-weight:700;font-size:30px;text-align:center;margin:0 0 40px;letter-spacing:.04em;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:32px;margin-bottom:24px;}
  .coins{display:flex;justify-content:center;gap:16px;margin-bottom:22px;height:44px;}
  .coin{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);
    font-size:15px;color:var(--gold);transition:transform .25s, background .2s, color .2s, border-color .2s;}
  .coin.small-text{font-size:10px;}
  .coin.yang{background:var(--surface);color:var(--gold);border-color:var(--gold);}
  .coin.yin{background:var(--gold);color:var(--surface);border-color:var(--gold);}
  .coin.flip{animation:flip .5s ease;}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
  .cast-btn{display:block;margin:0 auto 8px;font-family:var(--font-label);font-size:13px;
    letter-spacing:.1em;padding:10px 28px;border-radius:999px;border:1px solid var(--ink);
    background:transparent;color:var(--ink);cursor:pointer;}
  .cast-btn:disabled{opacity:.4;cursor:default;}
  #hexCard{position:relative;}
  .quick-cast-btn{position:absolute;bottom:8px;right:10px;margin:0;background:none;border:none;
    font-family:var(--font-label);font-size:11px;color:#b5ac9e;text-decoration:none;
    cursor:pointer;}
  .quick-cast-btn:disabled{opacity:.4;cursor:default;}
  .confirm-row{display:none;text-align:center;}
  .confirm-text{display:block;font-family:var(--font-label);font-size:13px;color:var(--sub);
    margin-bottom:14px;line-height:1.7;}
  .confirm-actions{display:flex;justify-content:center;gap:10px;}
  .confirm-actions button{font-family:var(--font-label);font-size:13px;letter-spacing:.05em;
    padding:9px 22px;border-radius:999px;cursor:pointer;}
  #confirmYes{background:var(--ink);color:var(--surface);border:1px solid var(--ink);}
  #confirmNo{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .cast-hint{text-align:center;font-size:14px;color:var(--sub);font-family:var(--font-label);margin:8px 0 20px;line-height:1.9;white-space:pre-line;}
  .progress{text-align:center;font-family:var(--font-label);font-size:12px;color:var(--jade);
    min-height:16px;margin-top:10px;}
  .result{display:none;}
  .result.show{display:block;}
  .hexrow{display:flex;align-items:center;gap:16px;margin-bottom:10px;}
  .hexrow:last-child{margin-bottom:0;}
  .hexrow.pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scaleY(.4);opacity:.2}60%{transform:scaleY(1.08)}100%{transform:scaleY(1);opacity:1}}
  .yao{flex:1;height:10px;display:flex;gap:8px;}
  .bar{flex:1;height:100%;background:var(--ink);border-radius:2px;}
  .label{font-family:var(--font-label);font-size:12px;color:var(--sub);width:32px;flex-shrink:0;}
  .moving{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .no-move{width:8px;flex-shrink:0;}
  .names{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px;flex-wrap:wrap;gap:8px;}
  .gua-name{font-family:var(--font-head);font-weight:700;font-size:22px;}
  .gua-num{font-family:var(--font-label);font-weight:400;font-size:11px;color:var(--sub);letter-spacing:.1em;margin-right:6px;}
  .arrow{color:var(--sub);font-size:13px;font-family:var(--font-label);}
  .zhi-name{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--sub);}
  .gua-ci{font-size:15px;line-height:1.9;margin:12px 0 0;}
  .zhi-gua-ci{color:var(--sub);margin-top:10px;}
  .zhi-label{display:block;font-family:var(--font-label);font-size:11px;letter-spacing:.1em;
    color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
  .hex-compare{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;margin:26px 0 0;align-items:stretch;}
  .hex-stack{margin:26px 0 0;}
  .hex-stack-item{text-align:center;}
  .hex-stack-divider{height:1px;background:var(--line);margin:24px 0;}
  .hex-arrow-col{position:relative;display:flex;align-items:center;justify-content:center;}
  .hex-arrow-col::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;
    background:var(--line);transform:translateX(-0.5px);}
  .hex-arrow{position:relative;background:var(--surface);padding:2px 8px;font-family:var(--font-label);
    font-size:12px;color:var(--sub);white-space:nowrap;z-index:1;}
  .hex-col .col-num-name{text-align:center;margin-bottom:8px;}
  .hex-col .col-gua-num{display:block;font-family:var(--font-label);font-size:11px;
    color:var(--sub);letter-spacing:.1em;margin-bottom:8px;}
  .hex-col .col-gua-name{font-family:var(--font-head);font-weight:700;font-size:18px;}
  .hex-col .col-label{text-align:center;font-family:var(--font-label);font-size:11px;letter-spacing:.15em;
    color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  .hex-col .col-gua-ci{font-size:13px;line-height:1.8;text-align:center;color:var(--ink);}
  .zhi-col .col-gua-name,.zhi-col .col-symbol{color:var(--sub);}
  .section-title{font-family:var(--font-label);font-size:11px;letter-spacing:.15em;color:var(--gold);
    text-transform:uppercase;margin:26px 0 10px;text-align:center;}
  .yao-ci-item{font-size:14px;line-height:1.9;margin-bottom:8px;}
  .yao-ci-item b{font-family:var(--font-head);font-weight:700;color:var(--accent);margin-right:6px;}
  .yao-ci-item.moving-line{background:rgba(185,132,85,.14);border-radius:4px;padding:8px 10px;margin:0 -10px 8px;}
  .no-change{font-family:var(--font-label);font-size:13px;color:var(--sub);margin-top:26px;text-align:center;}
  .version-toggle{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:8px;margin:0 0 20px;}
  .version-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .version-btn{font-family:var(--font-label);font-size:11px;letter-spacing:.03em;
    padding:5px 12px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--sub);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .version-btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}
  .version-btn.wilhelm-btn{border-color:var(--gold);color:var(--gold);text-decoration:none;
    display:inline-block;}
  .version-btn.wilhelm-btn:hover{background:var(--gold);color:var(--surface);}
  .hex-single{margin:26px 0 0;text-align:center;}
  .hex-single .col-num-name{margin-bottom:8px;}
  .hex-single .col-gua-num{display:block;font-family:var(--font-label);font-size:11px;
    color:var(--sub);letter-spacing:.1em;margin-bottom:8px;}
  .hex-single .col-gua-name{font-family:var(--font-head);font-weight:700;font-size:18px;}
  .col-symbol{font-size:30px;line-height:1;color:var(--ink);margin:6px 0 4px;text-align:center;}
  .hex-stack-item .col-num-name{margin-bottom:8px;}
  .hex-stack-item .col-gua-num{display:block;font-family:var(--font-label);font-size:11px;
    color:var(--sub);letter-spacing:.1em;margin-bottom:8px;}
  .hex-stack-item .col-gua-name{font-family:var(--font-head);font-weight:700;font-size:18px;}
  .hex-stack-item .col-label{text-align:center;font-family:var(--font-label);font-size:11px;letter-spacing:.15em;
    color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  .hex-stack-item:last-child .col-gua-name,.hex-stack-item:last-child .col-symbol{color:var(--sub);}
  .gua-ci-centered{font-size:15px;line-height:1.9;margin:10px 0 0;text-align:center;}
  .history-title{font-family:var(--font-label);font-size:12px;letter-spacing:.15em;color:var(--sub);
    text-transform:uppercase;margin-bottom:14px;}
  .hex-grid{display:grid;grid-template-columns:repeat(8, 1fr);gap:0;border:1px solid var(--line);}
  .hex-grid-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--line);
    font-family:var(--font-label);cursor:pointer;border-radius:3px;transition:background .15s;}
  .hex-grid-cell:active{background:rgba(185,132,85,.2);}
  .hex-grid-symbol{font-size:15px;line-height:1;color:var(--ink);}
  .hex-grid-num{font-size:8px;color:var(--sub);margin-top:1px;font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  .hex-modal-overlay{display:none;position:fixed;inset:0;background:rgba(51,41,31,.5);
    z-index:100;align-items:center;justify-content:center;padding:24px;}
  .hex-modal-overlay.show{display:flex;}
  .hex-modal-card{background:var(--surface);border-radius:6px;max-width:440px;width:100%;
    max-height:85vh;overflow-y:auto;padding:32px 24px;position:relative;}
  .hex-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;
    font-size:16px;color:var(--sub);cursor:pointer;padding:6px;line-height:1;}
  .hex-modal-lang{position:absolute;top:14px;left:14px;font-family:'Noto Sans TC',sans-serif;
    font-size:11px;letter-spacing:.05em;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(51,41,31,.15);background:var(--surface);color:var(--sub);cursor:pointer;}
  .hist-item{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;
    border-top:1px solid var(--line);color:var(--sub);}
  .hist-item:first-child{border-top:none;}
  .hist-item span:last-child{color:var(--ink);}
  .empty{font-family:var(--font-label);font-size:13px;color:var(--sub);text-align:center;padding:8px 0;}
  .intro-overlay{position:fixed;inset:0;background:var(--dot);opacity:.8;z-index:9999;pointer-events:none;
    animation:introShrink 4.5s cubic-bezier(.65,.05,.2,1) forwards;}
  @keyframes introShrink{
    0%{ clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%)); }
    100%{ clip-path:circle(7px at var(--cx,50%) var(--cy,50%)); }
  }
  .prompt-card{text-align:center;padding-top:22px;padding-bottom:22px;}
  .breathe-dot{width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle, var(--dot) 0%, var(--dot) 22%, transparent 68%);
    margin:0 auto 18px;animation:breathe 6s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.55;}
    50%{transform:scale(1.75);opacity:1;}
  }
  .breathe-hint{font-family:var(--font-label);font-size:11px;letter-spacing:.1em;color:var(--sub);
    text-align:center;margin:0 0 20px;}
  #question{width:100%;min-height:56px;resize:vertical;background:transparent;
    border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:0;
    font-family:var(--font-label);font-size:13px;color:var(--ink);line-height:1.7;text-align:center;}
  #question:focus{outline:none;border-color:var(--gold);}
  #question::placeholder{color:var(--sub);text-align:center;}
  #question::-webkit-input-placeholder{color:var(--sub);text-align:center;}
  #question::-moz-placeholder{color:var(--sub);text-align:center;opacity:1;}
  .asked{font-family:var(--font-label);font-size:12px;color:var(--sub);margin:0 0 4px;}
</style>
</head>

<script>
const TRIGRAMS = {

const RAW = [

 ['發蒙，利用刑人，用說桎梏，以往吝。','包蒙吉，納婦吉，子克家。','勿用取女，見金夫，不有躬，无攸利。','困蒙，吝。','童蒙，吉。','擊蒙，不利為寇，利禦寇。']],

 ['需于郊，利用恆，无咎。','需于沙，小有言，終吉。','需于泥，致寇至。','需于血，出自穴。','需于酒食，貞吉。','入于穴，有不速之客三人來，敬之終吉。']],
[6,'天水訟','乾','坎','有孚，窒惕，中吉，終凶。利見大人，不利涉大川。',
 ['不永所事，小有言，終吉。','不克訟，歸而逋，其邑人三百戶，无眚。','食舊德，貞厲，終吉。或從王事，无成。','不克訟，復即命渝，安貞吉。','訟，元吉。','或錫之鞶帶，終朝三褫之。']],
[7,'地水師','坤','坎','貞，丈人吉，无咎。',
 ['師出以律，否臧凶。','在師中，吉无咎，王三錫命。','師或輿尸，凶。','師左次，无咎。','田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。','大君有命，開國承家，小人勿用。']],
[8,'水地比','坎','坤','吉。原筮元永貞，无咎。不寧方來，後夫凶。',
 ['有孚比之，无咎。有孚盈缶，終來有它，吉。','比之自內，貞吉。','比之匪人。','外比之，貞吉。','顯比，王用三驅，失前禽，邑人不誡，吉。','比之无首，凶。']],
[9,'風天小畜','巽','乾','亨。密雲不雨，自我西郊。',
 ['復自道，何其咎，吉。','牽復，吉。','輿說輻，夫妻反目。','有孚，血去惕出，无咎。','有孚攣如，富以其鄰。','既雨既處，尚德載，婦貞厲。月幾望，君子征凶。']],
[10,'天澤履','乾','兌','履虎尾，不咥人，亨。',
 ['素履，往无咎。','履道坦坦，幽人貞吉。','眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。','履虎尾，愬愬，終吉。','夬履，貞厲。','視履考祥，其旋元吉。']],
[11,'地天泰','坤','乾','小往大來，吉亨。',
 ['拔茅茹，以其彙，征吉。','包荒，用馮河，不遐遺，朋亡，得尚于中行。','无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。','翩翩，不富以其鄰，不戒以孚。','帝乙歸妹，以祉元吉。','城復于隍，勿用師，自邑告命，貞吝。']],
[12,'天地否','乾','坤','否之匪人，不利君子貞，大往小來。',
 ['拔茅茹，以其彙，貞吉，亨。','包承，小人吉，大人否，亨。','包羞。','有命无咎，疇離祉。','休否，大人吉。其亡其亡，繫于苞桑。','傾否，先否後喜。']],
[13,'天火同人','乾','離','同人于野，亨。利涉大川，利君子貞。',
 ['同人于門，无咎。','同人于宗，吝。','伏戎于莽，升其高陵，三歲不興。','乘其墉，弗克攻，吉。','同人，先號咷而後笑，大師克相遇。','同人于郊，无悔。']],
[14,'火天大有','離','乾','元亨。',
 ['无交害，匪咎，艱則无咎。','大車以載，有攸往，无咎。','公用亨于天子，小人弗克。','匪其彭，无咎。','厥孚交如，威如，吉。','自天祐之，吉无不利。']],
[15,'地山謙','坤','艮','亨，君子有終。',
 ['謙謙君子，用涉大川，吉。','鳴謙，貞吉。','勞謙君子，有終吉。','无不利，撝謙。','不富，以其鄰，利用侵伐，无不利。','鳴謙，利用行師征邑國。']],
[16,'雷地豫','震','坤','利建侯行師。',
 ['鳴豫，凶。','介于石，不終日，貞吉。','盱豫，悔。遲有悔。','由豫，大有得，勿疑，朋盍簪。','貞疾，恆不死。','冥豫，成有渝，无咎。']],
[17,'澤雷隨','兌','震','元亨，利貞，无咎。',
 ['官有渝，貞吉，出門交有功。','係小子，失丈夫。','係丈夫，失小子，隨有求得，利居貞。','隨有獲，貞凶。有孚在道以明，何咎。','孚于嘉，吉。','拘係之，乃從維之，王用亨于西山。']],
[18,'山風蠱','艮','巽','元亨，利涉大川。先甲三日，後甲三日。',
 ['幹父之蠱，有子考无咎，厲終吉。','幹母之蠱，不可貞。','幹父之蠱，小有悔，无大咎。','裕父之蠱，往見吝。','幹父之蠱，用譽。','不事王侯，高尚其事。']],
[19,'地澤臨','坤','兌','元亨利貞。至于八月有凶。',
 ['咸臨，貞吉。','咸臨，吉无不利。','甘臨，无攸利。既憂之，无咎。','至臨，无咎。','知臨，大君之宜，吉。','敦臨，吉无咎。']],
[20,'風地觀','巽','坤','盥而不薦，有孚顒若。',
 ['童觀，小人无咎，君子吝。','闚觀，利女貞。','觀我生，進退。','觀國之光，利用賓于王。','觀我生，君子无咎。','觀其生，君子无咎。']],
[21,'火雷噬嗑','離','震','亨，利用獄。',
 ['屨校滅趾，无咎。','噬膚滅鼻，无咎。','噬臘肉，遇毒，小吝，无咎。','噬乾胏，得金矢，利艱貞，吉。','噬乾肉，得黃金，貞厲，无咎。','何校滅耳，凶。']],
[22,'山火賁','艮','離','亨，小利有攸往。',
 ['賁其趾，舍車而徒。','賁其須。','賁如濡如，永貞吉。','賁如皤如，白馬翰如，匪寇婚媾。','賁于丘園，束帛戔戔，吝，終吉。','白賁，无咎。']],
[23,'山地剝','艮','坤','不利有攸往。',
 ['剝床以足，蔑貞凶。','剝床以辨，蔑貞凶。','剝之，无咎。','剝床以膚，凶。','貫魚，以宮人寵，无不利。','碩果不食，君子得輿，小人剝廬。']],
[24,'地雷復','坤','震','亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。',
 ['不遠復，无祗悔，元吉。','休復，吉。','頻復，厲无咎。','中行獨復。','敦復，无悔。','迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。']],
[25,'天雷无妄','乾','震','元亨利貞。其匪正有眚，不利有攸往。',
 ['无妄，往吉。','不耕穫，不菑畬，則利有攸往。','无妄之災，或繫之牛，行人之得，邑人之災。','可貞，无咎。','无妄之疾，勿藥有喜。','无妄，行有眚，无攸利。']],
[26,'山天大畜','艮','乾','利貞，不家食吉，利涉大川。',
 ['有厲，利已。','輿說輹。','良馬逐，利艱貞，曰閑輿衛，利有攸往。','童牛之牿，元吉。','豶豕之牙，吉。','何天之衢，亨。']],
[27,'山雷頤','艮','震','貞吉。觀頤，自求口實。',
 ['舍爾靈龜，觀我朵頤，凶。','顛頤，拂經，于丘頤，征凶。','拂頤，貞凶，十年勿用，无攸利。','顛頤，吉。虎視眈眈，其欲逐逐，无咎。','拂經，居貞吉，不可涉大川。','由頤，厲吉，利涉大川。']],
[28,'澤風大過','兌','巽','棟橈，利有攸往，亨。',
 ['藉用白茅，无咎。','枯楊生稊，老夫得其女妻，无不利。','棟橈，凶。','棟隆，吉，有它吝。','枯楊生華，老婦得其士夫，无咎无譽。','過涉滅頂，凶，无咎。']],
[29,'坎為水','坎','坎','習坎，有孚，維心亨，行有尚。',
 ['習坎，入于坎窞，凶。','坎有險，求小得。','來之坎坎，險且枕，入于坎窞，勿用。','樽酒簋貳，用缶，納約自牖，終无咎。','坎不盈，祗既平，无咎。','係用徽纆，寘于叢棘，三歲不得，凶。']],
[30,'離為火','離','離','利貞，亨。畜牝牛，吉。',
 ['履錯然，敬之，无咎。','黃離，元吉。','日昃之離，不鼓缶而歌，則大耋之嗟，凶。','突如其來如，焚如，死如，棄如。','出涕沱若，戚嗟若，吉。','王用出征，有嘉折首，獲匪其醜，无咎。']],
[31,'澤山咸','兌','艮','亨，利貞，取女吉。',
 ['咸其拇。','咸其腓，凶，居吉。','咸其股，執其隨，往吝。','貞吉，悔亡。憧憧往來，朋從爾思。','咸其脢，无悔。','咸其輔頰舌。']],
[32,'雷風恆','震','巽','亨，无咎，利貞，利有攸往。',
 ['浚恆，貞凶，无攸利。','悔亡。','不恆其德，或承之羞，貞吝。','田无禽。','恆其德，貞，婦人吉，夫子凶。','振恆，凶。']],
[33,'天山遯','乾','艮','亨，小利貞。',
 ['遯尾，厲，勿用有攸往。','執之用黃牛之革，莫之勝說。','係遯，有疾厲，畜臣妾吉。','好遯，君子吉，小人否。','嘉遯，貞吉。','肥遯，无不利。']],
[34,'雷天大壯','震','乾','利貞。',
 ['壯于趾，征凶，有孚。','貞吉。','小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。','貞吉，悔亡。藩決不羸，壯于大輿之輹。','喪羊于易，无悔。','羝羊觸藩，不能退，不能遂，无攸利，艱則吉。']],
[35,'火地晉','離','坤','康侯用錫馬蕃庶，晝日三接。',
 ['晉如摧如，貞吉。罔孚，裕无咎。','晉如愁如，貞吉。受茲介福，于其王母。','眾允，悔亡。','晉如鼫鼠，貞厲。','悔亡，失得勿恤，往吉，无不利。','晉其角，維用伐邑，厲吉，无咎，貞吝。']],
[36,'地火明夷','坤','離','利艱貞。',
 ['明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。','明夷，夷于左股，用拯馬壯，吉。','明夷于南狩，得其大首，不可疾貞。','入于左腹，獲明夷之心，于出門庭。','箕子之明夷，利貞。','不明晦，初登于天，後入于地。']],
[37,'風火家人','巽','離','利女貞。',
 ['閑有家，悔亡。','无攸遂，在中饋，貞吉。','家人嗃嗃，悔厲吉。婦子嘻嘻，終吝。','富家，大吉。','王假有家，勿恤，吉。','有孚威如，終吉。']],
[38,'火澤睽','離','兌','小事吉。',
 ['悔亡，喪馬勿逐自復，見惡人无咎。','遇主于巷，无咎。','見輿曳，其牛掣，其人天且劓，无初有終。','睽孤，遇元夫，交孚，厲无咎。','悔亡，厥宗噬膚，往何咎。','睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。']],
[39,'水山蹇','坎','艮','利西南，不利東北，利見大人，貞吉。',
 ['往蹇來譽。','王臣蹇蹇，匪躬之故。','往蹇來反。','往蹇來連。','大蹇朋來。','往蹇來碩，吉，利見大人。']],
[40,'雷水解','震','坎','利西南，无所往，其來復吉。有攸往，夙吉。',
 ['无咎。','田獲三狐，得黃矢，貞吉。','負且乘，致寇至，貞吝。','解而拇，朋至斯孚。','君子維有解，吉，有孚于小人。','公用射隼于高墉之上，獲之，无不利。']],
[41,'山澤損','艮','兌','有孚，元吉，无咎，可貞，利有攸往。曷之用，二簋可用享。',
 ['已事遄往，无咎，酌損之。','利貞，征凶，弗損益之。','三人行則損一人，一人行則得其友。','損其疾，使遄有喜，无咎。','或益之十朋之龜，弗克違，元吉。','弗損益之，无咎，貞吉，利有攸往，得臣无家。']],
[42,'風雷益','巽','震','利有攸往，利涉大川。',
 ['利用為大作，元吉，无咎。','或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。','益之用凶事，无咎。有孚中行，告公用圭。','中行，告公從，利用為依遷國。','有孚惠心，勿問元吉。有孚惠我德。','莫益之，或擊之，立心勿恆，凶。']],
[43,'澤天夬','兌','乾','揚于王庭，孚號有厲，告自邑，不利即戎，利有攸往。',
 ['壯于前趾，往不勝為咎。','惕號，莫夜有戎，勿恤。','壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。','臀无膚，其行次且。牽羊悔亡，聞言不信。','莧陸夬夬，中行无咎。','无號，終有凶。']],
[44,'天風姤','乾','巽','女壯，勿用取女。',
 ['繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。','包有魚，无咎，不利賓。','臀无膚，其行次且，厲，无大咎。','包无魚，起凶。','以杞包瓜，含章，有隕自天。','姤其角，吝，无咎。']],
[45,'澤地萃','兌','坤','亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。',
 ['有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往无咎。','引吉，无咎，孚乃利用禴。','萃如嗟如，无攸利，往无咎，小吝。','大吉，无咎。','萃有位，无咎，匪孚，元永貞，悔亡。','齎咨涕洟，无咎。']],
[46,'地風升','坤','巽','元亨，用見大人，勿恤，南征吉。',
 ['允升，大吉。','孚乃利用禴，无咎。','升虛邑。','王用亨于岐山，吉，无咎。','貞吉，升階。','冥升，利于不息之貞。']],
[47,'澤水困','兌','坎','亨，貞，大人吉，无咎，有言不信。',
 ['臀困于株木，入于幽谷，三歲不覿。','困于酒食，朱紱方來，利用亨祀，征凶，无咎。','困于石，據于蒺藜，入于其宮，不見其妻，凶。','來徐徐，困于金車，吝，有終。','劓刖，困于赤紱，乃徐有說，利用祭祀。','困于葛藟，于臲卼，曰動悔，有悔，征吉。']],
[48,'水風井','坎','巽','改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。',
 ['井泥不食，舊井无禽。','井谷射鮒，甕敝漏。','井渫不食，為我心惻。可用汲，王明，並受其福。','井甃，无咎。','井洌，寒泉食。','井收勿幕，有孚元吉。']],
[49,'澤火革','兌','離','己日乃孚，元亨利貞，悔亡。',
 ['鞏用黃牛之革。','己日乃革之，征吉，无咎。','征凶，貞厲。革言三就，有孚。','悔亡，有孚改命，吉。','大人虎變，未占有孚。','君子豹變，小人革面，征凶，居貞吉。']],
[50,'火風鼎','離','巽','元吉，亨。',
 ['鼎顛趾，利出否，得妾以其子，无咎。','鼎有實，我仇有疾，不我能即，吉。','鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。','鼎折足，覆公餗，其形渥，凶。','鼎黃耳金鉉，利貞。','鼎玉鉉，大吉，无不利。']],
[51,'震為雷','震','震','亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。',
 ['震來虩虩，後笑言啞啞，吉。','震來厲，億喪貝，躋于九陵，勿逐，七日得。','震蘇蘇，震行无眚。','震遂泥。','震往來厲，億无喪，有事。','震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。']],
[52,'艮為山','艮','艮','艮其背，不獲其身，行其庭，不見其人，无咎。',
 ['艮其趾，无咎，利永貞。','艮其腓，不拯其隨，其心不快。','艮其限，列其夤，厲薰心。','艮其身，无咎。','艮其輔，言有序，悔亡。','敦艮，吉。']],
[53,'風山漸','巽','艮','女歸吉，利貞。',
 ['鴻漸于干，小子厲，有言，无咎。','鴻漸于磐，飲食衎衎，吉。','鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。','鴻漸于木，或得其桷，无咎。','鴻漸于陵，婦三歲不孕，終莫之勝，吉。','鴻漸于逵，其羽可用為儀，吉。']],
[54,'雷澤歸妹','震','兌','征凶，无攸利。',
 ['歸妹以娣，跛能履，征吉。','眇能視，利幽人之貞。','歸妹以須，反歸以娣。','歸妹愆期，遲歸有時。','帝乙歸妹，其君之袂不如其娣之袂良，月幾望，吉。','女承筐无實，士刲羊无血，无攸利。']],
[55,'雷火豐','震','離','亨，王假之，勿憂，宜日中。',
 ['遇其配主，雖旬无咎，往有尚。','豐其蔀，日中見斗，往得疑疾，有孚發若，吉。','豐其沛，日中見沬，折其右肱，无咎。','豐其蔀，日中見斗，遇其夷主，吉。','來章，有慶譽，吉。','豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。']],
[56,'火山旅','離','艮','小亨，旅貞吉。',
 ['旅瑣瑣，斯其所取災。','旅即次，懷其資，得童僕貞。','旅焚其次，喪其童僕，貞厲。','旅于處，得其資斧，我心不快。','射雉一矢亡，終以譽命。','鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。']],
[57,'巽為風','巽','巽','小亨，利有攸往，利見大人。',

const HEXAGRAMS = RAW.map(r=>({
  number:r[0], name:r[1], upper:r[2], lower:r[3], guaci:r[4], yao:r[5], yong:r[6]||null
}));

const BY_KEY = {};
HEXAGRAMS.forEach(h=>{
  const bits=[...TRIGRAMS[h.lower], ...TRIGRAMS[h.upper]];
  h.bits=bits;
  BY_KEY[bits.join('')] = h;
});

function hexSymbol(number){
  return String.fromCodePoint(0x4DC0 + number - 1);
}

let lang = 'zh';
let textVersion = 'zh';

const VERSION_LABELS = { zh:'原文', baihua:'白話', en2026:'2026', legge:'Legge 1899' };
const VERSION_GROUPS = { zh:['zh','baihua'], en:['en2026','legge'] };

function wilhelmUrl(number){
  return `https://www.wisdomportal.com/IChing/Hexagram${number}.html`;
}

function getGuaciText(hex){
  switch(textVersion){
    case 'baihua': return BAIHUA_GUACI[hex.number] || hex.guaci;
    case 'en2026': return ENGLISH_GUACI[hex.number] || hex.guaci;
    case 'legge':  return LEGGE_GUACI[hex.number] || hex.guaci;
    default:       return hex.guaci;
  }
}

function getYaoText(hex, pos){
  switch(textVersion){
    case 'baihua': return (BAIHUA_YAO[hex.number] && BAIHUA_YAO[hex.number].yao[pos]) || hex.yao[pos];
    case 'en2026': return (ENGLISH_YAO[hex.number] && ENGLISH_YAO[hex.number].yao[pos]) || hex.yao[pos];
    case 'legge':  return (LEGGE_YAO[hex.number] && LEGGE_YAO[hex.number].yao[pos]) || hex.yao[pos];
    default:       return hex.yao[pos];
  }
}

function getYongText(hex){
  switch(textVersion){
    case 'baihua': return (BAIHUA_YAO[hex.number] && BAIHUA_YAO[hex.number].yong) || hex.yong;
    case 'en2026': return (ENGLISH_YAO[hex.number] && ENGLISH_YAO[hex.number].yong) || hex.yong;
    case 'legge':  return (LEGGE_YAO[hex.number] && LEGGE_YAO[hex.number].yong) || hex.yong;
    default:       return hex.yong;
  }
}

// 確保目前的版本選擇，跟目前的 UI 語言（中／英）是相容的一組；
// 切換 UI 語言時，若原本選的版本不屬於新語言的按鈕組，就回到該組的預設值。
function syncVersionToLang(){
  const group = VERSION_GROUPS[lang];
  if(!group.includes(textVersion)){
    textVersion = group[0];
  }
}

function versionToggleHtml(number){
  const group = VERSION_GROUPS[lang];
  const btns = group.map(v=>
    `<button class="version-btn${textVersion===v?' active':''}" data-version="${v}">${VERSION_LABELS[v]}</button>`
  ).join('');
  const wilhelmBtn = lang==='en'
    ? `<a class="version-btn wilhelm-btn" href="${wilhelmUrl(number)}" target="_blank" rel="noopener">Wilhelm 1950 ↗</a>`
    : '';
  return `<div class="version-toggle">
    <div class="version-btns">${btns}${wilhelmBtn}</div>
  </div>`;
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.version-btn:not(.wilhelm-btn)');
  if(!btn) return;
  textVersion = btn.dataset.version;
  if(hexModalOverlay.classList.contains('show') && currentModalNum){
    openHexModal(currentModalNum);
  } else if(lastResult && resultCard.classList.contains('show')){
    renderResult(lastResult.hex, lastResult.zhiHex, lastResult.lines, lastResult.question);
  }
});

(function playIntro(){
  const overlay = document.getElementById('introOverlay');
  const dot = document.querySelector('.breathe-dot');
  if(!overlay || !dot) return;
  const rect = dot.getBoundingClientRect();
  overlay.style.setProperty('--cx', (rect.left + rect.width/2) + 'px');
  overlay.style.setProperty('--cy', (rect.top + rect.height/2) + 'px');
  dot.style.visibility = 'hidden';
  const introDurationMs = 4500;
  setTimeout(() => { dot.style.visibility = 'visible'; }, introDurationMs - 500);
  overlay.addEventListener('animationend', () => overlay.remove());
})();

function resetRows(){ hexLinesEl.innerHTML = ''; }

function addRow(pos, bit, moving){
  const bars = bit===1 ? '<div class="bar"></div>' : '<div class="bar"></div><div class="bar"></div>';
  const marker = moving ? '<span class="moving"></span>' : '<span class="no-move"></span>';
  const row = document.createElement('div');
  row.className = 'hexrow pop';
  row.innerHTML = `<span class="label">${T[lang].positions[pos]}</span><div class="yao">${bars}</div>${marker}`;
  hexLinesEl.prepend(row);
}

castBtn.textContent = T[lang].castLine(1);
const confirmRow = document.getElementById('confirmRow');
const confirmYes = document.getElementById('confirmYes');
const confirmNo = document.getElementById('confirmNo');
const quickCastBtn = document.getElementById('quickCastBtn');
let pendingAction = 'reset';

function resetForNewCasting(){
  hasResult = false;
  resultCard.classList.remove('show');
  resetRows();
  questionEl.value = '';
  questionEl.disabled = false;
  castBtn.textContent = T[lang].castLine(1);
  castHintEl.innerHTML = T[lang].promptFirst.replace(/\n/g, '<br>');
  progressEl.textContent = '';
  coinsEl.querySelectorAll('.coin').forEach(el=>{
    el.textContent = '－';
    el.classList.remove('yang','yin');
  });
}

async function performQuickCast(){
  castBtn.disabled = true;
  quickCastBtn.disabled = true;
  resultCard.classList.remove('show');
  resetRows();
  currentQuestion = questionEl.value.trim();
  questionEl.disabled = true;
  castLines = [];
  for(let i=0; i<6; i++){
    const c1=tossCoin(), c2=tossCoin(), c3=tossCoin();
    const sum=c1+c2+c3;
    const yang=(sum===7||sum===9);
    const moving=(sum===6||sum===9);
    castLines.push({bit: yang?1:0, moving});
    coinsEl.querySelectorAll('.coin').forEach((el,idx)=>{
      const v=[c1,c2,c3][idx];
      el.textContent = v===3 ? T[lang].yang : T[lang].yin;
      el.classList.remove('yang','yin');
      el.classList.add(v===3 ? 'yang' : 'yin');
      el.classList.toggle('small-text', lang==='en');
    });
    addRow(i, yang?1:0, moving);
    progressEl.textContent = T[lang].progress(i+1, T[lang].positions[i], moving);
    await new Promise(r=>setTimeout(r, 90));
  }
  castHintEl.innerHTML = T[lang].doneText.replace(/\n/g, '<br>');
  finishCast(castLines);
  castLines = [];
  hasResult = true;
  castBtn.textContent = T[lang].castAgain;
  castBtn.disabled = false;
  quickCastBtn.disabled = false;
}

castBtn.addEventListener('click', () => {
  if(hasResult){
    pendingAction = 'reset';
    castBtn.style.display = 'none';
    confirmRow.style.display = 'block';
    return;
  }
  tossOnce();
});

quickCastBtn.addEventListener('click', () => {
  if(hasResult){
    pendingAction = 'quickcast';
    castBtn.style.display = 'none';
    confirmRow.style.display = 'block';
    return;
  }
  performQuickCast();
});

confirmNo.addEventListener('click', () => {
  confirmRow.style.display = 'none';
  castBtn.style.display = 'block';
});

confirmYes.addEventListener('click', () => {
  confirmRow.style.display = 'none';
  castBtn.style.display = 'block';
  resetForNewCasting();
  if(pendingAction === 'quickcast'){
    performQuickCast();
  }
  pendingAction = 'reset';
});

const castHintEl = document.getElementById('castHint');

function typewriterReveal(text, el, charDelay){
  return new Promise(resolve=>{
    el.textContent = '';
    let i = 0;
    (function step(){
      if(i < text.length){
        el.textContent += text[i];
        i++;
        setTimeout(step, charDelay);
      } else {
        resolve();
      }
    })();
  });
}

async function tossOnce(){
  if(castLines.length===0){
    resultCard.classList.remove('show');
    resetRows();
    currentQuestion = questionEl.value.trim();
    questionEl.disabled = true;
    setTimeout(() => {
      document.getElementById('inputCard').scrollIntoView({behavior:'smooth', block:'start'});
    }, 100);
  }

  const c1=tossCoin(), c2=tossCoin(), c3=tossCoin();
  const sum=c1+c2+c3;
  const yang = (sum===7 || sum===9);
  const moving = (sum===6 || sum===9);
  castLines.push({bit: yang?1:0, moving});

  coinsEl.querySelectorAll('.coin').forEach((el,idx)=>{
    const v=[c1,c2,c3][idx];
    el.textContent = v===3 ? T[lang].yang : T[lang].yin;
    el.classList.remove('yang','yin');
    el.classList.add(v===3 ? 'yang' : 'yin');
    el.classList.toggle('small-text', lang==='en');
    el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
  });

  const pos = castLines.length-1;
  addRow(pos, yang?1:0, moving);
  progressEl.textContent = T[lang].progress(pos+1, T[lang].positions[pos], moving);

  const isLast = castLines.length === 6;
  const nextPromptText = isLast
    ? T[lang].doneText
    : T[lang].promptNext(castLines.length+1);

  if(!isLast){
    castBtn.disabled = true;
    await typewriterReveal(nextPromptText, castHintEl, 150);
    castBtn.disabled = false;
    castBtn.textContent = T[lang].castLine(castLines.length+1);
  } else {
    castHintEl.textContent = nextPromptText;
    finishCast(castLines);
    castLines = [];
    hasResult = true;
    castBtn.textContent = T[lang].castAgain;
  }
}

let lastResult = null;

function finishCast(lines){
  const bits = lines.map(l=>l.bit);
  const key = bits.join('');
  const hex = BY_KEY[key];
  const hasMoving = lines.some(l=>l.moving);
  let zhiHex = null;
  if(hasMoving){
    const zhiBits = bits.map((b,idx)=> lines[idx].moving ? (1-b) : b);
    zhiHex = BY_KEY[zhiBits.join('')];
  }
  lastResult = {hex, zhiHex, lines, question: currentQuestion};
  renderResult(hex, zhiHex, lines, currentQuestion);
  history.unshift({time:new Date(), hex, zhiHex, hasMoving, question: currentQuestion});
  renderHistory();
  progressEl.textContent = '';
  questionEl.disabled = false;
  questionEl.value = '';
  currentQuestion = '';
}

function guaNameDisplay(hex){
  if(lang==='en'){
    return `${ENGLISH_NAMES[hex.number]}<br><span style="font-size:12px;color:var(--sub);font-weight:400;">${coreName(hex)} ${CORE_NAME_PINYIN[hex.number]}</span>`;
  }
  return `${coreName(hex)}卦<br><span style="font-size:12px;color:var(--sub);font-weight:400;">${hex.name}</span>`;
}

function guaciDisplay(hex){
  return getGuaciText(hex);
}

function renderResult(hex, zhiHex, lines, question){
  let html = '';
  if(question){
    html += `<p class="asked">${T[lang].asked(escapeHtml(question))}</p>`;
  }
  html += versionToggleHtml(hex.number);
  if(zhiHex){
    if(lang==='en'){
      html += `<div class="hex-stack">
        <div class="hex-stack-item">
          <div class="col-label">${T[lang].benGua}</div>
          <div class="col-num-name"><span class="col-gua-num">${T[lang].guaNum(hex.number)}</span><span class="col-gua-name">${guaNameDisplay(hex)}</span></div>
          <div class="col-symbol">${hexSymbol(hex.number)}</div>
          <p class="gua-ci-centered">${guaciDisplay(hex)}</p>
        </div>
        <div class="hex-stack-divider"></div>
        <div class="hex-stack-item">
          <div class="col-label">${T[lang].zhiGua}</div>
          <div class="col-num-name"><span class="col-gua-num">${T[lang].guaNum(zhiHex.number)}</span><span class="col-gua-name">${guaNameDisplay(zhiHex)}</span></div>
          <div class="col-symbol">${hexSymbol(zhiHex.number)}</div>
          <p class="gua-ci-centered">${guaciDisplay(zhiHex)}</p>
        </div>
      </div>`;
    } else {
      html += `<div class="hex-compare">
        <div class="hex-col">
          <div class="col-label">${T[lang].benGua}</div>
          <div class="col-num-name"><span class="col-gua-num">${T[lang].guaNum(hex.number)}</span><span class="col-gua-name">${guaNameDisplay(hex)}</span></div>
          <div class="col-symbol">${hexSymbol(hex.number)}</div>
          <p class="col-gua-ci">${guaciDisplay(hex)}</p>
        </div>
        <div class="hex-arrow-col"><div class="hex-arrow">${T[lang].arrow()}</div></div>
        <div class="hex-col zhi-col">
          <div class="col-label">${T[lang].zhiGua}</div>
          <div class="col-num-name"><span class="col-gua-num">${T[lang].guaNum(zhiHex.number)}</span><span class="col-gua-name">${guaNameDisplay(zhiHex)}</span></div>
          <div class="col-symbol">${hexSymbol(zhiHex.number)}</div>
          <p class="col-gua-ci">${guaciDisplay(zhiHex)}</p>
        </div>
      </div>`;
    }
  } else {
    html += `<div class="hex-single">
      <div class="col-num-name"><span class="col-gua-num">${T[lang].guaNum(hex.number)}</span><span class="col-gua-name">${guaNameDisplay(hex)}</span></div>
          <div class="col-symbol">${hexSymbol(hex.number)}</div>
      <p class="gua-ci-centered">${guaciDisplay(hex)}</p>
    </div>`;
  }

  const movingLines = lines.map((l,idx)=>({...l, pos:idx})).filter(l=>l.moving);
  const movingSet = new Set(movingLines.map(l=>l.pos));

  html += `<div class="section-title">${T[lang].sectionTitle}</div>`;
  for(let pos=0; pos<6; pos++){
    const label = lang==='en'
      ? `Line ${pos+1}`
      : lineLabel(pos, lines[pos].bit===1);
    const isMoving = movingSet.has(pos);
    const yaoText = getYaoText(hex, pos);
    html += `<div class="yao-ci-item${isMoving?' moving-line':''}"><b>${label}</b>${yaoText}</div>`;
  }
  if(movingLines.length===6 && (hex.number===1 || hex.number===2)){
    const label = hex.number===1 ? T[lang].yongJiu : T[lang].yongLiu;
    const yongText = getYongText(hex);
    html += `<div class="yao-ci-item moving-line"><b>${label}</b>${yongText}</div>`;
  }
  if(movingLines.length===0){
    html += `<p class="no-change">${T[lang].noChange}</p>`;
  }

  resultCard.innerHTML = html;
  resultCard.classList.add('show');
}

function historyName(hex){
  return lang==='en' ? ENGLISH_NAMES[hex.number] : hex.name;
}

function renderHistory(){
  if(history.length===0){ historyEl.innerHTML = `<p class="empty">${T[lang].empty}</p>`; return; }
  historyEl.innerHTML = history.map(h=>{
    const t = h.time.toLocaleTimeString(T[lang].locale, {hour:'2-digit',minute:'2-digit'});
    const label = h.hasMoving ? `${historyName(h.hex)} → ${historyName(h.zhiHex)}` : historyName(h.hex);
    const q = h.question ? `<br><span style="font-size:12px;">${escapeHtml(h.question)}</span>` : '';
    return `<div class="hist-item"><span>${t}${q}</span><span>${label}</span></div>`;
  }).join('');
}

const langToggle = document.getElementById('langToggle');
const eyebrowEl = document.getElementById('eyebrowText');
const pageTitleEl = document.getElementById('pageTitle');
const breatheHintEl = document.getElementById('breatheHint');
const confirmTextEl = document.getElementById('confirmText');
const historyTitleEl = document.getElementById('historyTitle');
const lookupTitleEl = document.getElementById('lookupTitle');
const hexGridEl = document.getElementById('hexGrid');
const hexModalOverlay = document.getElementById('hexModalOverlay');
const hexModalBody = document.getElementById('hexModalBody');
const hexModalClose = document.getElementById('hexModalClose');
const hexModalLang = document.getElementById('hexModalLang');

const BAGUA_ORDER = ['乾','兌','離','震','巽','坎','艮','坤'];

function populateHexGrid(){
  let html = '';
  BAGUA_ORDER.forEach(lower=>{
    BAGUA_ORDER.forEach(upper=>{
      const bits = [...TRIGRAMS[lower], ...TRIGRAMS[upper]];
      const hex = BY_KEY[bits.join('')];
      html += `<div class="hex-grid-cell" data-num="${hex.number}">
        <div class="hex-grid-symbol">${hexSymbol(hex.number)}</div>
        <div class="hex-grid-num">${String(hex.number).padStart(2,'0')}</div>
      </div>`;
    });
  });
  hexGridEl.innerHTML = html;
}

let currentModalNum = null;

function openHexModal(num){
  currentModalNum = num;
  const hex = HEXAGRAMS.find(h=>h.number===num);
  if(!hex) return;
  const lines = hex.bits.map(b=>({bit:b, moving:false}));
  hexModalBody.innerHTML = `
    <div class="col-num-name" style="text-align:center;">
      <span class="col-gua-num">${T[lang].guaNum(hex.number)}</span>
      <span class="col-gua-name" style="font-family:var(--font-head);font-weight:700;font-size:18px;">${guaNameDisplay(hex)}</span>
    </div>
    <div class="col-symbol" style="font-size:30px;line-height:1;color:var(--ink);margin:6px 0 4px;text-align:center;">${hexSymbol(hex.number)}</div>
    ${versionToggleHtml(hex.number)}
    <p class="gua-ci-centered">${guaciDisplay(hex)}</p>
    <div class="section-title">${T[lang].sectionTitle}</div>
    ${lines.map((l,pos)=>{
      const label = lang==='en' ? `Line ${pos+1}` : lineLabel(pos, l.bit===1);
      const yaoText = getYaoText(hex, pos);
      return `<div class="yao-ci-item"><b>${label}</b>${yaoText}</div>`;
    }).join('')}
  `;
  hexModalOverlay.classList.add('show');
}

hexGridEl.addEventListener('click', (e)=>{
  const cell = e.target.closest('.hex-grid-cell[data-num]');
  if(cell) openHexModal(parseInt(cell.dataset.num, 10));
});

hexModalClose.addEventListener('click', ()=> hexModalOverlay.classList.remove('show'));
hexModalLang.addEventListener('click', () => {
  lang = lang==='zh' ? 'en' : 'zh';
  syncVersionToLang();
  applyLanguage();
});
hexModalOverlay.addEventListener('click', (e)=>{
  if(e.target === hexModalOverlay) hexModalOverlay.classList.remove('show');
});

populateHexGrid();

function applyLanguage(){
  langToggle.textContent = lang==='zh' ? 'EN' : '中文';
  hexModalLang.textContent = lang==='zh' ? 'EN' : '中文';
  eyebrowEl.textContent = T[lang].eyebrow;
  pageTitleEl.textContent = T[lang].title;
  breatheHintEl.textContent = T[lang].breatheHint;
  questionEl.placeholder = T[lang].placeholder;
  confirmTextEl.textContent = T[lang].confirmText;
  confirmYes.textContent = T[lang].confirmYes;
  confirmNo.textContent = T[lang].confirmNo;
  historyTitleEl.textContent = T[lang].historyTitle;
  lookupTitleEl.textContent = T[lang].lookupTitle;
  populateHexGrid();
  if(hexModalOverlay.classList.contains('show') && currentModalNum){
    openHexModal(currentModalNum);
  }
  quickCastBtn.textContent = T[lang].quickCast;

  if(hasResult){
    castBtn.textContent = T[lang].castAgain;
    castHintEl.innerHTML = T[lang].doneText.replace(/\n/g, '<br>');
  } else if(castLines.length===0){
    castBtn.textContent = T[lang].castLine(1);
    castHintEl.innerHTML = T[lang].promptFirst.replace(/\n/g, '<br>');
  } else {
    castBtn.textContent = T[lang].castLine(castLines.length+1);
    castHintEl.innerHTML = T[lang].promptNext().replace(/\n/g, '<br>');
  }

  coinsEl.querySelectorAll('.coin').forEach(el=>{
    if(el.classList.contains('yang')) el.textContent = T[lang].yang;
    else if(el.classList.contains('yin')) el.textContent = T[lang].yin;
    el.classList.toggle('small-text', lang==='en');
  });

  if(lastResult && resultCard.classList.contains('show')){
    renderResult(lastResult.hex, lastResult.zhiHex, lastResult.lines, lastResult.question);
  }
  renderHistory();
}

langToggle.addEventListener('click', () => {
  lang = lang==='zh' ? 'en' : 'zh';
  syncVersionToLang();
  applyLanguage();
});
</script>
